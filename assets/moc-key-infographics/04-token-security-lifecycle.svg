<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">MOC Key Token and Security Lifecycle</title>
  <desc id="desc">Infographic explaining MOC Key token types, storage locations, validation checks, and OAuth security rules.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#d8dee8;stroke-width:2}.head{fill:#24456f}.soft{fill:#e2e8f0}.ok{fill:#ecfdf5;stroke:#99f6e4;stroke-width:2}.warn{fill:#fff7ed;stroke:#fed7aa;stroke-width:2}.bad{fill:#fef2f2;stroke:#fecaca;stroke-width:2}.text{fill:#162033;font-family:Inter,Arial,sans-serif}.title{font-size:52px;font-weight:800}.subtitle{font-size:23px}.h{font-size:27px;font-weight:800}.label{font-size:18px;font-weight:800}.small{font-size:16px}.tiny{font-size:14px}.muted{fill:#64748b}.white{fill:#fff}.arrow{stroke:#24456f;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#24456f"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <text class="text title" x="80" y="90">Token and Security Lifecycle</text>
  <text class="text subtitle muted" x="82" y="130">How MOC Key tokens move through login, API access, refresh, revocation, and QR verification.</text>

  <rect class="card" x="80" y="195" width="1440" height="220" rx="22"/>
  <rect class="head" x="80" y="195" width="1440" height="58" rx="22"/>
  <text class="text h white" x="115" y="233">Token types</text>
  <g transform="translate(115 285)">
    <rect class="ok" x="0" y="0" width="250" height="88" rx="14"/>
    <text class="text label" x="24" y="34">Authorization code</text>
    <text class="text small muted" x="24" y="62">Short-lived, one-time exchange</text>
    <rect class="ok" x="285" y="0" width="250" height="88" rx="14"/>
    <text class="text label" x="309" y="34">Access token</text>
    <text class="text small muted" x="309" y="62">Calls protected APIs</text>
    <rect class="warn" x="570" y="0" width="250" height="88" rx="14"/>
    <text class="text label" x="594" y="34">Refresh token</text>
    <text class="text small muted" x="594" y="62">Backend only, rotate often</text>
    <rect class="ok" x="855" y="0" width="250" height="88" rx="14"/>
    <text class="text label" x="879" y="34">ID token</text>
    <text class="text small muted" x="879" y="62">Authentication claims</text>
    <rect class="warn" x="1140" y="0" width="250" height="88" rx="14"/>
    <text class="text label" x="1164" y="34">QR payload</text>
    <text class="text small muted" x="1164" y="62">Signed scan session</text>
  </g>

  <rect class="card" x="80" y="480" width="450" height="320" rx="18"/>
  <text class="text h" x="115" y="532">Store safely</text>
  <text class="text small muted" x="115" y="575">Backend: client secret, code verifier,</text>
  <text class="text small muted" x="115" y="603">refresh token, callback secret.</text>
  <text class="text small muted" x="115" y="650">Browser: redirect only, QR display,</text>
  <text class="text small muted" x="115" y="678">short UI status. No client secrets.</text>
  <rect class="bad" x="115" y="720" width="360" height="48" rx="12"/>
  <text class="text label" x="140" y="751">Never put secrets in frontend code</text>

  <rect class="card" x="575" y="480" width="450" height="320" rx="18"/>
  <text class="text h" x="610" y="532">Validate every request</text>
  <text class="text small muted" x="610" y="575">Token: signature, issuer, audience,</text>
  <text class="text small muted" x="610" y="603">expiry, subject, scope, and client.</text>
  <text class="text small muted" x="610" y="650">Callback: signature, timestamp, event ID,</text>
  <text class="text small muted" x="610" y="678">session ID, client ID, and environment.</text>
  <rect class="ok" x="610" y="720" width="360" height="48" rx="12"/>
  <text class="text label" x="635" y="751">Reject replayed events and old QR codes</text>

  <rect class="card" x="1070" y="480" width="450" height="320" rx="18"/>
  <text class="text h" x="1105" y="532">Operate by environment</text>
  <text class="text small muted" x="1105" y="575">Local, UAT, and production must use</text>
  <text class="text small muted" x="1105" y="603">different clients, secrets, URLs, keys,</text>
  <text class="text small muted" x="1105" y="631">scopes, and callback allowlists.</text>
  <text class="text small muted" x="1105" y="678">Production scanner: official moc-app.</text>
  <rect class="warn" x="1105" y="720" width="360" height="48" rx="12"/>
  <text class="text label" x="1130" y="751">Do not mix UAT and production credentials</text>

  <path class="arrow" d="M300 835 C470 900 640 900 800 835"/>
  <path class="arrow" d="M800 835 C960 900 1130 900 1300 835"/>
  <text class="text label" x="578" y="908">Audit everything</text>
  <text class="text small muted" x="704" y="908">login, token exchange, QR creation, scan result, callback delivery, and business decision.</text>
</svg>
