<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">MOC Key OAuth 2.0 System Overview</title>
  <desc id="desc">Infographic showing MOC Key as the OAuth 2.0 identity layer connecting client applications, protected APIs, users, and scanner apps.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d8dee8;stroke-width:2}.primary{fill:#24456f}.teal{fill:#0f766e}.blue{fill:#2563eb}.amber{fill:#b45309}.muted{fill:#64748b}.text{fill:#162033;font-family:Inter,Arial,sans-serif}.title{font-size:54px;font-weight:800}.subtitle{font-size:24px}.h{font-size:28px;font-weight:800}.label{font-size:18px;font-weight:700}.small{font-size:17px}.tiny{font-size:14px}.arrow{stroke:#24456f;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#arrowMuted)}.badge{fill:#e0f2fe}.badge2{fill:#ccfbf1}.badge3{fill:#fef3c7}.shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#24456f"/>
    </marker>
    <marker id="arrowMuted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <text class="text title" x="80" y="92">MOC Key OAuth 2.0 System Overview</text>
  <text class="text subtitle muted" x="82" y="132">One identity and verification layer for MOC web, API, mobile, and scanner applications.</text>

  <rect class="panel shadow" x="80" y="195" width="300" height="190" rx="18"/>
  <circle cx="128" cy="247" r="28" fill="#dbeafe"/>
  <text class="text h" x="175" y="253">Citizen / Officer</text>
  <text class="text small muted" x="115" y="302">Resource owner</text>
  <text class="text small muted" x="115" y="332">Signs in, consents, or presents identity</text>

  <rect class="panel shadow" x="80" y="560" width="300" height="220" rx="18"/>
  <circle cx="128" cy="612" r="28" fill="#fef3c7"/>
  <text class="text h" x="175" y="618">Scanner App</text>
  <text class="text small muted" x="115" y="667">UAT: mocdigikey web scanner</text>
  <text class="text small muted" x="115" y="697">Production: official moc-app</text>
  <text class="text small muted" x="115" y="727">Verifies QR sessions and officer permission</text>

  <rect class="panel shadow" x="500" y="175" width="305" height="245" rx="18"/>
  <rect class="badge" x="535" y="213" width="145" height="34" rx="17"/>
  <text class="text tiny blue" x="558" y="236">CLIENT APP</text>
  <text class="text h" x="535" y="285">identity-client-app</text>
  <text class="text small muted" x="535" y="323">Starts login or verification</text>
  <text class="text small muted" x="535" y="353">Displays QR and status</text>

  <rect class="panel shadow" x="500" y="540" width="305" height="260" rx="18"/>
  <rect class="badge" x="535" y="578" width="160" height="34" rx="17"/>
  <text class="text tiny blue" x="558" y="601">CLIENT API</text>
  <text class="text h" x="535" y="650">identity-client-api</text>
  <text class="text small muted" x="535" y="688">Stores client secret</text>
  <text class="text small muted" x="535" y="718">Exchanges OAuth code</text>
  <text class="text small muted" x="535" y="748">Validates callbacks and signatures</text>

  <rect class="panel shadow" x="935" y="275" width="330" height="340" rx="22"/>
  <rect class="badge2" x="970" y="315" width="140" height="34" rx="17"/>
  <text class="text tiny teal" x="994" y="338">MOC KEY</text>
  <text class="text h" x="970" y="390">identity-moc-api</text>
  <text class="text small muted" x="970" y="430">OAuth authorization server</text>
  <text class="text small muted" x="970" y="462">User authentication and consent</text>
  <text class="text small muted" x="970" y="494">Client, scope, and redirect validation</text>
  <text class="text small muted" x="970" y="526">Token issuing and QR signing</text>
  <text class="text small muted" x="970" y="558">Audit events and verification result</text>

  <rect class="panel shadow" x="1360" y="175" width="160" height="245" rx="18"/>
  <text class="text h" x="1388" y="245">APIs</text>
  <text class="text small muted" x="1388" y="292">Protected</text>
  <text class="text small muted" x="1388" y="322">MOC data</text>
  <text class="text small muted" x="1388" y="352">services</text>

  <rect class="panel shadow" x="1360" y="540" width="160" height="260" rx="18"/>
  <text class="text h" x="1388" y="617">Audit</text>
  <text class="text small muted" x="1388" y="664">Events</text>
  <text class="text small muted" x="1388" y="694">Logs</text>
  <text class="text small muted" x="1388" y="724">Reports</text>

  <path class="arrow" d="M380 278 C425 278 445 278 500 278"/>
  <text class="text tiny primary" x="405" y="258">login / consent</text>
  <path class="arrow" d="M653 420 C653 470 653 500 653 540"/>
  <text class="text tiny primary" x="678" y="488">backend request</text>
  <path class="arrow" d="M805 660 C870 645 895 570 935 515"/>
  <text class="text tiny primary" x="820" y="615">token + verification APIs</text>
  <path class="arrow" d="M805 300 C875 315 900 355 935 390"/>
  <text class="text tiny primary" x="823" y="286">redirect to authorize</text>
  <path class="arrow" d="M1265 385 C1305 345 1325 310 1360 292"/>
  <text class="text tiny primary" x="1280" y="335">bearer token</text>
  <path class="dash" d="M1265 560 C1305 610 1325 655 1360 680"/>
  <text class="text tiny muted" x="1280" y="632">audit stream</text>
  <path class="arrow" d="M380 672 C430 672 455 672 500 672"/>
  <text class="text tiny primary" x="410" y="650">scan QR</text>
  <path class="arrow" d="M380 612 C610 500 740 454 935 445"/>
  <text class="text tiny primary" x="548" y="512">submit scan result</text>

  <rect x="80" y="875" width="1440" height="70" rx="18" fill="#e2e8f0"/>
  <text class="text label" x="118" y="920">Rule:</text>
  <text class="text small muted" x="178" y="920">Frontend displays and redirects. Backend owns secrets, token exchange, callback validation, QR status, and business decisions.</text>
</svg>
